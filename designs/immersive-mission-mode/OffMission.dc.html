<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
    a { color: #0F859E; } a:hover { color: #0A667D; }
    .tw { border-bottom: 2px dotted rgba(92,92,102,0.45); padding-bottom: 1px; }
  </style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; color: #111114; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Toolbar -->
  <div style="margin-top: 62px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#111114" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 2.5l10 10M12.5 2.5l-10 10"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 18px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: rgba(82,82,82,0.20);"></div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="#5C5C66"><path d="M1.5 2.2v9.6c0 .5.55.8.97.53l7.03-4.53c.4-.26.4-.84 0-1.1L2.47 2.17c-.42-.27-.97.03-.97.53z"></path><rect x="12.2" y="1.8" width="2.2" height="10.4" rx="1.1"></rect></svg>
    </div>
  </div>

  <!-- Mission banner -->
  <div style="margin: 12px 24px 0; padding: 8px 8px 8px 16px; border-radius: 16px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); display: flex; align-items: center; gap: 10px;">
    <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="#0F859E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8.5 1.6l1.5 1.2 1.9-.3.7 1.8 1.8.7-.3 1.9 1.2 1.5-1.2 1.5.3 1.9-1.8.7-.7 1.8-1.9-.3-1.5 1.2-1.5-1.2-1.9.3-.7-1.8-1.8-.7.3-1.9L1.7 8.4l1.2-1.5-.3-1.9 1.8-.7.7-1.8 1.9.3z"></path><path d="M6 8.6l1.7 1.7 3.3-3.4"></path></svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 15px; font-weight: 500; color: #111114;">Order at the bakery</span>
        <svg width="9" height="6" viewBox="0 0 10 6" fill="none" stroke="#737378" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"></path></svg>
      </div>
      <span style="font-size: 12px; color: #737378;">Act 2 of 3</span>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 20px; background: #F7F0E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#96650F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8c-2.7 0-4.8 2.1-4.8 4.7 0 1.6.8 3 2 3.8v1.6c0 .5.4.9.9.9h3.8c.5 0 .9-.4.9-.9v-1.6c1.2-.8 2-2.2 2-3.8 0-2.6-2.1-4.7-4.8-4.7z"></path><path d="M6.4 15h3.2"></path></svg>
    </div>
  </div>

  <!-- Feed: the off-errand line -->
  <div style="margin: 14px 24px 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex: 1; min-height: 0;">
    <div style="font-size: 12px; font-weight: 600; color: #5C5C66;">You</div>
    <div style="padding: 10px 14px; border-radius: 18px; background: rgba(255,255,255,0.9); border: 2px solid #0F859E; max-width: 300px;">
      <div style="font-size: 20px; line-height: 1.35; color: #111114;"><span class="tw">Ich</span> <span class="tw">m&ouml;chte</span> <span class="tw">einen</span> <span class="tw">Kaffee</span>, <span class="tw">bitte</span>.</div>
    </div>
  </div>

  <!-- Graceful redirect: amber, never red — good German, different errand -->
  <div style="border-radius: 28px 28px 0 0; background: #FBFBFD; border: 1px solid rgba(82,82,82,0.16); border-bottom: none; box-shadow: 0 -8px 28px rgba(20,20,19,0.08); padding: 14px 16px 26px; display: flex; flex-direction: column; gap: 8px;">

    <div style="box-sizing: border-box; border-radius: 18px; background: #FFF6E8; border: 1px solid rgba(242,168,51,0.45); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#96650F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8.5v-3a2 2 0 00-2-2H3.8M6 1l-3 2.5L6 6M2.5 8.5v3a2 2 0 002 2h7.7"></path></svg>
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: #96650F;">GOOD GERMAN &mdash; DIFFERENT ERRAND</div>
      </div>
      <div style="font-size: 16px; line-height: 1.4; color: #111114;">A fine sentence &mdash; but the baker&rsquo;s waiting to hear about the rolls. Try again, or lean on a hint.</div>
    </div>

    <!-- The mission line re-pins itself -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #F7F0E0;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#96650F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8 2.2c-2.9 0-5.2 2.2-5.2 5 0 1.7.9 3.2 2.2 4.1v1.9c0 .5.4.9.9.9h4.2c.5 0 .9-.4.9-.9v-1.9c1.3-.9 2.2-2.4 2.2-4.1 0-2.8-2.3-5-5.2-5z"></path></svg>
      <div style="font-size: 15px; font-weight: 500; line-height: 1.3; color: #3D3526;">Your turn &mdash; you&rsquo;d like two bread rolls.</div>
    </div>

    <!-- Doors back in -->
    <div style="min-height: 48px; box-sizing: border-box; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20); padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#0A667D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5h8M2 6h8M2 8.5h5"></path></svg>
      <span style="font-size: 15px; font-weight: 600; color: #0A667D;">Show the three lines</span>
    </div>

    <!-- Your text comes back, editable — never lost, never red-penned -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="flex: 1; min-height: 44px; box-sizing: border-box; border-radius: 22px; background: #FFFFFF; border: 1.5px solid rgba(15,133,158,0.45); padding: 12px 16px; display: flex; align-items: center;">
        <span style="font-size: 17px; color: #111114;">Ich m&ouml;chte einen Kaffee, bitte.</span><span style="display: inline-block; width: 2px; height: 20px; background: #0F859E; margin-left: 2px; border-radius: 1px;"></span>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(180deg, #1491AC 0%, #0F859E 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
