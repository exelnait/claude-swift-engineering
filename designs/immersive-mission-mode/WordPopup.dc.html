<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
    a { color: #0F859E; } a:hover { color: #0A667D; }
    .tw { border-bottom: 2px dotted rgba(92,92,102,0.45); padding-bottom: 1px; }
  </style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; color: #111114; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Backdrop: the reveal state (system popover adds no scrim) -->
  <div style="margin-top: 62px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#111114" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 2.5l10 10M12.5 2.5l-10 10"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 18px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: rgba(82,82,82,0.20);"></div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="#5C5C66"><path d="M1.5 2.2v9.6c0 .5.55.8.97.53l7.03-4.53c.4-.26.4-.84 0-1.1L2.47 2.17c-.42-.27-.97.03-.97.53z"></path><rect x="12.2" y="1.8" width="2.2" height="10.4" rx="1.1"></rect></svg>
    </div>
  </div>

  <div style="margin: 12px 24px 0; padding: 8px 8px 8px 16px; border-radius: 16px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); display: flex; align-items: center; gap: 10px;">
    <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="#0F859E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8.5 1.6l1.5 1.2 1.9-.3.7 1.8 1.8.7-.3 1.9 1.2 1.5-1.2 1.5.3 1.9-1.8.7-.7 1.8-1.9-.3-1.5 1.2-1.5-1.2-1.9.3-.7-1.8-1.8-.7.3-1.9L1.7 8.4l1.2-1.5-.3-1.9 1.8-.7.7-1.8 1.9.3z"></path><path d="M6 8.6l1.7 1.7 3.3-3.4"></path></svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 15px; font-weight: 500; color: #111114;">Order at the bakery</span>
        <svg width="9" height="6" viewBox="0 0 10 6" fill="none" stroke="#737378" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"></path></svg>
      </div>
      <span style="font-size: 12px; color: #737378;">Act 2 of 3</span>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 20px; background: #F7F0E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#96650F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8c-2.7 0-4.8 2.1-4.8 4.7 0 1.6.8 3 2 3.8v1.6c0 .5.4.9.9.9h3.8c.5 0 .9-.4.9-.9v-1.6c1.2-.8 2-2.2 2-3.8 0-2.6-2.1-4.7-4.8-4.7z"></path><path d="M6.4 15h3.2"></path></svg>
    </div>
  </div>

  <!-- Anchored word popup (system popover chrome: material, radius, arrow, shadow) -->
  <div style="margin: 16px auto 0; width: 320px; border-radius: 13px; background: rgba(252,252,253,0.98); box-shadow: 0 12px 40px rgba(0,0,0,0.18), 0 2px 10px rgba(0,0,0,0.08); position: relative; z-index: 2;">
    <div style="padding: 16px 24px; display: flex; flex-direction: column; gap: 14px;">

      <!-- Header: headword + speaker · CEFR + save -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="font-size: 25px; font-weight: 700; line-height: 1.05; white-space: nowrap;">das Br&ouml;tchen</div>
        <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="19" height="17" viewBox="0 0 20 18" fill="none" stroke="#5C5C66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5v5h3l4 3.5V3L6 6.5H3z" fill="#5C5C66" stroke="none"></path><path d="M13 6a4.2 4.2 0 010 6M15.5 4a7.4 7.4 0 010 10"></path></svg>
        </div>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
          <div style="padding: 4px 9px; border-radius: 999px; background: rgba(15,133,158,0.78); font-size: 12px; font-weight: 500; color: #FFFFFF;">A1</div>
          <svg width="15" height="19" viewBox="0 0 15 19" fill="none" stroke="#5C5C66" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 2h10v15l-5-3.6L2.5 17V2z"></path></svg>
        </div>
      </div>

      <!-- Meta line: IPA · POS · frequency -->
      <div style="display: flex; align-items: center; font-size: 13px; white-space: nowrap;">
        <span style="color: #5C5C66;">/&#712;b&#641;&#248;&#720;t&#231;&#601;n/</span>
        <span style="color: #737378;">&nbsp;&middot;&nbsp;</span>
        <span style="color: #1668C7;">noun</span>
        <span style="color: #737378;">&nbsp;&middot;&nbsp;</span>
        <span style="display: inline-flex; align-items: flex-end; gap: 2px; margin-right: 5px;">
          <span style="display: inline-block; width: 3px; height: 4px; border-radius: 1px; background: #0F859E;"></span>
          <span style="display: inline-block; width: 3px; height: 7px; border-radius: 1px; background: #0F859E;"></span>
          <span style="display: inline-block; width: 3px; height: 10px; border-radius: 1px; background: #0F859E;"></span>
        </span>
        <span style="color: #5C5C66;">very common</span>
      </div>

      <!-- Translation: the one serif line, brand teal -->
      <div style="font-family: ui-serif, 'New York', Georgia, serif; font-size: 20px; font-weight: 600; color: #0F859E;">bread roll</div>

      <!-- In this sentence -->
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #737378;">IN THIS SENTENCE</div>
        <div style="padding: 10px; border-radius: 12px; background: rgba(15,133,158,0.10); border: 1px solid rgba(15,133,158,0.14); font-size: 16px; font-weight: 500; color: #5C5C66;">What you&rsquo;re ordering &mdash; two of them, fresh.</div>
      </div>

      <!-- Example (the act's own line) -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #737378;">EXAMPLE</div>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <div style="font-size: 16px; line-height: 1.4; flex: 1;">Ich h&auml;tte gern zwei <b>Br&ouml;tchen</b>.</div>
          <svg width="11" height="8" viewBox="0 0 12 8" fill="none" stroke="#737378" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M1.5 1.5L6 6l4.5-4.5"></path></svg>
        </div>
      </div>

      <!-- Maturity -->
      <div style="display: flex; align-items: center; gap: 8px; padding-top: 2px;">
        <div style="display: flex; gap: 3px;">
          <span style="width: 6px; height: 6px; border-radius: 3px; background: #5C5C66;"></span>
          <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(128,128,128,0.45);"></span>
          <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(128,128,128,0.45);"></span>
          <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(128,128,128,0.45);"></span>
        </div>
        <span style="font-size: 12px; font-weight: 600; color: #5C5C66;">New word</span>
      </div>
    </div>
    <!-- Popover arrow -->
    <div style="position: absolute; left: 50%; bottom: -9px; width: 18px; height: 18px; transform: translateX(-50%) rotate(45deg); background: rgba(252,252,253,0.98); border-radius: 3px; box-shadow: 6px 6px 12px rgba(0,0,0,0.06);"></div>
  </div>

  <!-- The bottom panel below: the tapped word sits under the arrow -->
  <div style="margin-top: 20px; border-radius: 28px 28px 0 0; background: #FBFBFD; border: 1px solid rgba(82,82,82,0.16); border-bottom: none; box-shadow: 0 -8px 28px rgba(20,20,19,0.08); padding: 14px 16px 26px; display: flex; flex-direction: column; gap: 8px; flex: 1;">
    <div style="position: relative; min-height: 56px; box-sizing: border-box; border-radius: 18px; background: #DEF1E7; border: 1px solid rgba(46,168,107,0.4); padding: 14px 16px; display: flex; align-items: center; justify-content: center;">
      <div style="font-size: 17px; font-weight: 500; text-align: center; line-height: 1.3;"><span class="tw">Ich</span> <span class="tw">h&auml;tte</span> <span class="tw">gern</span> <span class="tw">zwei</span> <span class="tw" style="background: #CAEBEA; border-radius: 6px; padding: 1px 3px;">Br&ouml;tchen</span>.</div>
      <div style="position: absolute; top: 7px; right: 7px;">
        <svg width="17" height="17" viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="7.6" fill="#2EA86B"></circle><path d="M5.3 8.8l2.1 2.1 4.3-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </div>

    <div style="margin-top: auto; height: 54px; border-radius: 27px; background: linear-gradient(180deg, #1491AC 0%, #0F859E 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Continue</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
