        <div style="font-size: 13px; line-height: 1.4; color: #5C5C66;">This story still plays as a listen lesson. Missions come back when you&rsquo;re online.</div>

      <div style="font-size: 17px; font-weight: 600;">Words you&rsquo;ll meet</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">

  <div style="margin-top: auto; padding: 16px 24px 30px; background: linear-gradient(to bottom, rgba(240,245,245,0) 0%, #F0F5F5 55%);">
