<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
    a { color: #0F859E; } a:hover { color: #0A667D; }
  </style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; color: #111114; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Toolbar (below the real status bar; no fake chrome) -->
  <div style="margin-top: 62px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#111114" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 2.5l10 10M12.5 2.5l-10 10"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 18px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: rgba(82,82,82,0.20);"></div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="#5C5C66"><path d="M1.5 2.2v9.6c0 .5.55.8.97.53l7.03-4.53c.4-.26.4-.84 0-1.1L2.47 2.17c-.42-.27-.97.03-.97.53z"></path><rect x="12.2" y="1.8" width="2.2" height="10.4" rx="1.1"></rect></svg>
    </div>
  </div>

  <!-- Mission banner: can-do line + acts as speech-act objectives -->
  <div style="margin: 12px 24px 0; padding: 12px 16px; border-radius: 16px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="#0F859E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.6l1.5 1.2 1.9-.3.7 1.8 1.8.7-.3 1.9 1.2 1.5-1.2 1.5.3 1.9-1.8.7-.7 1.8-1.9-.3-1.5 1.2-1.5-1.2-1.9.3-.7-1.8-1.8-.7.3-1.9L1.7 8.4l1.2-1.5-.3-1.9 1.8-.7.7-1.8 1.9.3z"></path><path d="M6 8.6l1.7 1.7 3.3-3.4"></path></svg>
      <div style="font-size: 15px; font-weight: 500; color: #5C5C66;">Order at the bakery</div>
    </div>
    <div style="display: flex; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 12px; background: #DEF1E7; border: 1px solid rgba(46,168,107,0.4);">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#1E7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4l2.6 2.6L10 3.4"></path></svg>
        <span style="font-size: 12px; font-weight: 600; color: #1E7A4B;">Greet</span>
      </div>
      <div style="display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 12px; background: #E3F0F3; border: 1px solid rgba(15,133,158,0.4);">
        <div style="width: 7px; height: 7px; border-radius: 4px; background: #0F859E;"></div>
        <span style="font-size: 12px; font-weight: 600; color: #0A667D;">Order</span>
      </div>
      <div style="display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 12px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20);">
        <div style="width: 7px; height: 7px; border-radius: 4px; border: 1.4px solid #737378; box-sizing: border-box;"></div>
        <span style="font-size: 12px; font-weight: 600; color: #737378;">Pay</span>
      </div>
      <div style="margin-left: auto; font-size: 12px; color: #737378; align-self: center;">Act 2 of 3</div>
    </div>
  </div>

  <!-- Scene: the last dialogue turn stays on stage -->
  <div style="margin: 14px 24px 0; display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 12px; font-weight: 600; color: #5C5C66;">B&auml;ckerin</div>
    <div style="padding: 10px 14px; border-radius: 18px; background: rgba(255,255,255,0.9); border: 2px solid #0F859E; align-self: flex-start; max-width: 320px; display: flex; align-items: center; gap: 8px;">
      <div style="font-size: 20px; line-height: 1.35; color: #111114;">Guten Morgen! <span style="background: #CAEBEA; border-radius: 6px; padding: 0 2px;">Was</span> darf es sein?</div>
    </div>
  </div>

  <!-- Situation framing: pinned, warm creme, native language -->
  <div style="margin: 16px 24px 0; padding: 14px 16px; border-radius: 18px; background: #F7F0E0; display: flex; flex-direction: column; gap: 5px;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#96650F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2c-2.9 0-5.2 2.2-5.2 5 0 1.7.9 3.2 2.2 4.1v1.9c0 .5.4.9.9.9h4.2c.5 0 .9-.4.9-.9v-1.9c1.3-.9 2.2-2.4 2.2-4.1 0-2.8-2.3-5-5.2-5z"></path></svg>
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #96650F;">YOUR TURN</div>
    </div>
    <div style="font-size: 17px; font-weight: 500; line-height: 1.35; color: #3D3526;">You&rsquo;d like two bread rolls. What do you say?</div>
  </div>

  <!-- Option board: HalmOptionSelect stack -->
  <div style="margin: 14px 24px 0; display: flex; flex-direction: column; gap: 8px;">
    <div style="min-height: 60px; box-sizing: border-box; border-radius: 18px; background: #E3F0F3; border: 1px solid rgba(15,133,158,0.4); padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="font-size: 17px; font-weight: 500; text-align: center; line-height: 1.3;">Ich <span style="border-bottom: 2px dotted rgba(92,92,102,0.55); padding-bottom: 1px;">will</span> zwei Br&ouml;tchen.</div>
    </div>
    <div style="min-height: 60px; box-sizing: border-box; border-radius: 18px; background: #E3F0F3; border: 1px solid rgba(15,133,158,0.4); padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="font-size: 17px; font-weight: 500; text-align: center; line-height: 1.3;">Ich <span style="border-bottom: 2px dotted rgba(92,92,102,0.55); padding-bottom: 1px;">h&auml;tte gern</span> zwei Br&ouml;tchen.</div>
    </div>
    <div style="min-height: 60px; box-sizing: border-box; border-radius: 18px; background: #E3F0F3; border: 1px solid rgba(15,133,158,0.4); padding: 16px; display: flex; align-items: center; justify-content: center;">
      <div style="font-size: 17px; font-weight: 500; text-align: center; line-height: 1.3;"><span style="border-bottom: 2px dotted rgba(92,92,102,0.55); padding-bottom: 1px;">Geben</span> Sie mir zwei Br&ouml;tchen.</div>
    </div>
  </div>

  <!-- Bottom hint bar (CTA arrives with the reveal; bar height stays stable) -->
  <div style="margin-top: auto; padding: 0 24px 30px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
    <div style="display: flex; align-items: center; gap: 6px; color: #5C5C66; font-size: 13px;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#5C5C66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 14.2l-3.6-3.4c-.5-.5-.5-1.3 0-1.8s1.3-.5 1.8 0l.9.9V4.2c0-.7.6-1.3 1.3-1.3s1.3.6 1.3 1.3v3.6l2.9.7c.8.2 1.3.9 1.3 1.7v1.9c0 1.2-1 2.1-2.1 2.1H7.2z"></path><path d="M5.4 3.2a3.4 3.4 0 015.7 1.4"></path></svg>
      <span>Tap the line you&rsquo;d say</span>
    </div>
    <div style="height: 54px; width: 100%; border-radius: 22px; opacity: 0;"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
