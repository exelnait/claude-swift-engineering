<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; }
    a { color: #0F859E; } a:hover { color: #0A667D; }
    .tw { border-bottom: 2px dotted rgba(92,92,102,0.45); padding-bottom: 1px; }
  </style>
</helmet>
<div style="width: 1000px; height: 744px; box-sizing: border-box; background: #FFFFFF; color: #111114; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Toolbar -->
  <div style="margin-top: 34px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#111114" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 2.5l10 10M12.5 2.5l-10 10"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 18px; height: 5px; border-radius: 2.5px; background: #0F859E;"></div>
      <div style="width: 12px; height: 5px; border-radius: 2.5px; background: rgba(82,82,82,0.20);"></div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); box-shadow: 0 1px 3px rgba(20,20,19,0.06); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="#5C5C66"><path d="M1.5 2.2v9.6c0 .5.55.8.97.53l7.03-4.53c.4-.26.4-.84 0-1.1L2.47 2.17c-.42-.27-.97.03-.97.53z"></path><rect x="12.2" y="1.8" width="2.2" height="10.4" rx="1.1"></rect></svg>
    </div>
  </div>

  <!-- Two panes: the feed keeps reading, the act rail stands beside it -->
  <div style="flex: 1; display: flex; gap: 24px; padding: 16px 24px 28px; min-height: 0;">

    <!-- Left: mission + feed (content capped, adaptiveContentWidth idiom) -->
    <div style="flex: 1; max-width: 560px; display: flex; flex-direction: column; gap: 14px; min-width: 0;">
      <div style="padding: 10px 10px 10px 16px; border-radius: 16px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); display: flex; align-items: center; gap: 10px;">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="#0F859E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8.5 1.6l1.5 1.2 1.9-.3.7 1.8 1.8.7-.3 1.9 1.2 1.5-1.2 1.5.3 1.9-1.8.7-.7 1.8-1.9-.3-1.5 1.2-1.5-1.2-1.9.3-.7-1.8-1.8-.7.3-1.9L1.7 8.4l1.2-1.5-.3-1.9 1.8-.7.7-1.8 1.9.3z"></path><path d="M6 8.6l1.7 1.7 3.3-3.4"></path></svg>
        <div style="flex: 1; display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 500; color: #111114;">Order at the bakery</span>
          <svg width="9" height="6" viewBox="0 0 10 6" fill="none" stroke="#737378" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"></path></svg>
        </div>
        <span style="font-size: 12px; color: #737378;">Act 2 of 3</span>
        <div style="width: 40px; height: 40px; border-radius: 20px; background: #F7F0E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#96650F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8c-2.7 0-4.8 2.1-4.8 4.7 0 1.6.8 3 2 3.8v1.6c0 .5.4.9.9.9h3.8c.5 0 .9-.4.9-.9v-1.6c1.2-.8 2-2.2 2-3.8 0-2.6-2.1-4.7-4.8-4.7z"></path><path d="M6.4 15h3.2"></path></svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end;">
          <div style="font-size: 12px; font-weight: 600; color: #5C5C66;">You</div>
          <div style="padding: 10px 14px; border-radius: 18px; background: rgba(255,255,255,0.9); border: 1px solid rgba(82,82,82,0.20); max-width: 380px;">
            <div style="font-size: 20px; line-height: 1.35;"><span class="tw">Guten</span> <span class="tw">Morgen</span>!</div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 12px; font-weight: 600; color: #5C5C66;">B&auml;ckerin</span>
            <svg width="13" height="12" viewBox="0 0 20 18" fill="none" stroke="#0F859E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5v5h3l4 3.5V3L6 6.5H3z" fill="#0F859E" stroke="none"></path><path d="M13 6a4.2 4.2 0 010 6"></path></svg>
          </div>
          <div style="padding: 10px 14px; border-radius: 18px; background: rgba(255,255,255,0.9); border: 2px solid #0F859E; align-self: flex-start; max-width: 420px;">
            <div style="font-size: 20px; line-height: 1.35;"><span class="tw">Guten</span> <span class="tw">Morgen</span>! <span class="tw" style="background: #CAEBEA; border-radius: 6px; padding: 0 2px;">Was</span> <span class="tw">darf</span> <span class="tw">es</span> <span class="tw">sein</span>?</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: the act rail — same components, no bottom sheet on regular width -->
    <div style="width: 360px; flex-shrink: 0; border-radius: 28px; background: #FBFBFD; border: 1px solid rgba(82,82,82,0.16); box-shadow: 0 8px 28px rgba(20,20,19,0.08); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; align-self: flex-start;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #F7F0E0;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#96650F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8 2.2c-2.9 0-5.2 2.2-5.2 5 0 1.7.9 3.2 2.2 4.1v1.9c0 .5.4.9.9.9h4.2c.5 0 .9-.4.9-.9v-1.9c1.3-.9 2.2-2.4 2.2-4.1 0-2.8-2.3-5-5.2-5z"></path></svg>
        <div style="font-size: 15px; font-weight: 500; line-height: 1.3; color: #3D3526;">Your turn &mdash; you&rsquo;d like two bread rolls.</div>
      </div>

      <div style="min-height: 52px; box-sizing: border-box; border-radius: 18px; background: #E3F0F3; border: 1px solid rgba(15,133,158,0.4); padding: 13px 16px; display: flex; align-items: center; justify-content: center;">
        <div style="font-size: 17px; font-weight: 500; text-align: center; line-height: 1.3;"><span class="tw">Ich</span> <span class="tw">will</span> <span class="tw">zwei</span> <span class="tw">Br&ouml;tchen</span>.</div>
      </div>
      <div style="min-height: 52px; box-sizing: border-box; border-radius: 18px; background: #E3F0F3; border: 1px solid rgba(15,133,158,0.4); padding: 13px 16px; display: flex; align-items: center; justify-content: center;">
        <div style="font-size: 17px; font-weight: 500; text-align: center; line-height: 1.3;"><span class="tw">Ich</span> <span class="tw">h&auml;tte</span> <span class="tw">gern</span> <span class="tw">zwei</span> <span class="tw">Br&ouml;tchen</span>.</div>
      </div>
      <div style="min-height: 52px; box-sizing: border-box; border-radius: 18px; background: #E3F0F3; border: 1px solid rgba(15,133,158,0.4); padding: 13px 16px; display: flex; align-items: center; justify-content: center;">
        <div style="font-size: 17px; font-weight: 500; text-align: center; line-height: 1.3;"><span class="tw">Geben</span> <span class="tw">Sie</span> <span class="tw">mir</span> <span class="tw">zwei</span> <span class="tw">Br&ouml;tchen</span>.</div>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="display: flex; gap: 6px;">
          <div style="width: 36px; height: 30px; border-radius: 9px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20); display: flex; align-items: center; justify-content: center; font-size: 14px;">&auml;</div>
          <div style="width: 36px; height: 30px; border-radius: 9px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20); display: flex; align-items: center; justify-content: center; font-size: 14px;">&ouml;</div>
          <div style="width: 36px; height: 30px; border-radius: 9px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20); display: flex; align-items: center; justify-content: center; font-size: 14px;">&uuml;</div>
          <div style="width: 36px; height: 30px; border-radius: 9px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20); display: flex; align-items: center; justify-content: center; font-size: 14px;">&szlig;</div>
        </div>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 4px;">
          <span style="font-size: 13px; font-weight: 600; color: #0F859E;">Need a phrase?</span>
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#0F859E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5L7 5 3 8.5"></path></svg>
        </div>
      </div>

      <div style="min-height: 44px; box-sizing: border-box; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20); padding: 12px 16px; display: flex; align-items: center;">
        <span style="font-size: 17px; color: #737378;">Antworte auf Deutsch &hellip;</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
