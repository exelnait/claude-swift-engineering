    <!-- ScenarioHero: per-emoji mesh + white vignette pool + glyph, r22, card shadow -->
    <div style="height: 220px; border-radius: 22px; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.12); background:

      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 88px; line-height: 1;">&#129360;</div>
    </div>

    <!-- Summary -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-family: ui-serif, 'New York', Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1.15;">Beim B&auml;cker</div>

          <svg width="11" height="11" viewBox="0 0 12 12" fill="#0F859E"><rect x="1" y="7" width="2.4" height="4" rx="0.7"></rect><rect x="4.8" y="4.5" width="2.4" height="6.5" rx="0.7"></rect><rect x="8.6" y="1.5" width="2.4" height="9.5" rx="0.7"></rect></svg>
          <span style="font-size: 12px; font-weight: 600; color: #0F859E;">A1</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.85); border: 1px solid rgba(15,12,8,0.07);">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#111114" stroke-width="1.3" stroke-linecap="round"><circle cx="6" cy="6" r="5"></circle><path d="M6 3.2V6l1.9 1.4"></path></svg>
          <span style="font-size: 12px; font-weight: 500; color: #111114;">6 min</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.85); border: 1px solid rgba(15,12,8,0.07);">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="#111114"><path d="M6 .8l1.1.9 1.4-.2.5 1.3 1.3.5-.2 1.4.9 1.1-.9 1.1.2 1.4-1.3.5-.5 1.3-1.4-.2-1.1.9-1.1-.9-1.4.2-.5-1.3-1.3-.5.2-1.4L.8 6l.9-1.1-.2-1.4 1.3-.5.5-1.3 1.4.2L6 .8z"></path><path d="M4.2 6.1l1.2 1.2 2.4-2.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span style="font-size: 12px; font-weight: 500; color: #111114;">Curated</span>
        </div>
      </div>
    </div>

    <!-- NEW: how to play this story -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 17px; font-weight: 600;">How do you want this story?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <div style="box-sizing: border-box; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(82,82,82,0.20); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5C5C66" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 13.5v-3a6.8 6.8 0 0113.6 0v3"></path><rect x="2" y="11.5" width="3.6" height="5.6" rx="1.6"></rect><rect x="14.4" y="11.5" width="3.6" height="5.6" rx="1.6"></rect></svg>
          <div style="font-size: 17px; font-weight: 500;">Listen</div>
          <div style="font-size: 12px; line-height: 1.35; color: #5C5C66;">Follow the story and catch its words</div>
        </div>
        <div style="box-sizing: border-box; border-radius: 18px; background: #E3F0F3; border: 1.5px solid rgba(15,133,158,0.45); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#0F859E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1.9l1.8 1.4 2.2-.3.8 2.1 2.1.8-.3 2.2 1.4 1.8-1.4 1.8.3 2.2-2.1.8-.8 2.1-2.2-.3-1.8 1.4-1.8-1.4-2.2.3-.8-2.1-2.1-.8.3-2.2L2 9.9l1.4-1.8-.3-2.2 2.1-.8.8-2.1 2.2.3L10 1.9z"></path><path d="M7 10.2l2 2 4-4.1"></path></svg>
          <div style="font-size: 17px; font-weight: 500; color: #0A4A5C;">Mission</div>
          <div style="font-size: 12px; line-height: 1.35; color: #0A667D;">Step in and speak at 3 moments</div>
          <div style="font-size: 11px; color: #5C5C66;">Greet &middot; Order &middot; Pay</div>
        </div>
      </div>
    </div>

    <!-- Words you'll meet -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 17px; font-weight: 600;">Words you&rsquo;ll meet</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="padding: 11px 16px; border-radius: 6px; background: rgba(116,116,128,0.10); font-size: 17px;">das Br&ouml;tchen</div>
        <div style="padding: 11px 16px; border-radius: 6px; background: rgba(116,116,128,0.10); font-size: 17px;">bezahlen</div>
        <div style="padding: 11px 16px; border-radius: 6px; background: rgba(116,116,128,0.10); font-size: 17px;">gern</div>
      </div>
    </div>
  </div>

  <!-- Pinned CTA over a systemBackground fade -->
  <div style="margin-top: auto; padding: 16px 24px 30px; background: linear-gradient(to bottom, rgba(240,245,245,0) 0%, #F0F5F5 55%);">
    <div style="height: 60px; border-radius: 30px; background: linear-gradient(180deg, #1491AC 0%, #0F859E 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Start mission</span>
    </div>
  </div>
</div>
</x-dc>
